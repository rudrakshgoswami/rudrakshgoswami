<svg xmlns="http://www.w3.org/2000/svg" width="280" height="190" viewBox="0 0 280 190" role="img" aria-label="vincent-app, JavaScript. MERN booking platform. Venue slots lock in real time over Socket.io, so no double books."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070912"/><stop offset="1" stop-color="#0E1222"/></linearGradient><radialGradient id="halo" cx="0.22" cy="0.12" r="0.85"><stop offset="0" stop-color="#818CF8" stop-opacity="0.26"/><stop offset="0.55" stop-color="#6366F1" stop-opacity="0.06"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient><linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0.6"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#F2F4FF"/><stop offset="1" stop-color="#DCE2FF"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.42"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><clipPath id="card"><rect width="280" height="190" rx="14"/></clipPath></defs><style>@font-face{font-family:'Display';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Mono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@keyframes rise{from{transform:translateY(26px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes sweep{0%{transform:translateX(-120%)}55%,100%{transform:translateX(220%)}}@keyframes breathe{0%,100%{opacity:.30}50%{opacity:.85}}.rise{animation:rise .85s cubic-bezier(.17,.84,.26,1) both}.fade{animation:fade .7s ease-out both}.sweep{animation:sweep 4.6s ease-in-out 1.4s infinite}.breathe{animation:breathe 3.6s ease-in-out infinite}.d150{animation-delay:0.150s}.d270{animation-delay:0.270s}.d450{animation-delay:0.450s}.d520{animation-delay:0.520s}.d590{animation-delay:0.590s}@media (prefers-reduced-motion:reduce){.rise,.fade,.sweep,.breathe{animation:none!important;opacity:1!important;transform:none!important}}</style><rect width="280" height="190" rx="14" fill="url(#bg)"/><rect width="280" height="190" rx="14" fill="url(#halo)"/><g clip-path="url(#card)"><circle cx="28" cy="32" r="5" fill="#F1E05A" class="fade breathe"/><text x="42.0" y="36.0" font-family="Mono" font-size="10.0" fill="#6A72A0" letter-spacing="1.60" class="fade d150">JAVASCRIPT</text><text x="256" y="36" text-anchor="end" font-family="Mono" font-size="12" fill="#A5B4FC" class="fade d150">&#8599;</text><text x="24" y="86" font-family="Display" font-size="24" fill="url(#sheen)" class="rise d270">vincent-app</text><line x1="24" y1="104" x2="256" y2="104" stroke="#232A4D" class="fade d450"/><text x="24.0" y="127.0" font-family="Mono" font-size="12.0" fill="#949DC2" letter-spacing="0.00" class="fade d450">MERN booking platform. Venue</text><text x="24.0" y="145.0" font-family="Mono" font-size="12.0" fill="#949DC2" letter-spacing="0.00" class="fade d520">slots lock in real time over</text><text x="24.0" y="163.0" font-family="Mono" font-size="12.0" fill="#949DC2" letter-spacing="0.00" class="fade d590">Socket.io, so no double books.</text></g><rect width="280" height="190" rx="14" fill="none" stroke="#232A4D"/></svg>