:0.520s}.d590{animation-delay:0.590s}.d660{animation-delay:0.660s}@media (prefers-reduced-motion:reduce){.rise,.fade,.sweep,.breathe{animation:none!important;opacity:1!important;transform:none!important}}</style><rect width="416" height="210" rx="14" fill="url(#bg)"/><rect width="416" height="210" rx="14" fill="url(#halo)"/><g clip-path="url(#card)"><rect x="24" y="26" width="10" height="10" rx="3" fill="#A78BFA" class="fade breathe"/><text x="44.0" y="35.0" font-family="Mono" font-size="10.0" fill="#6A72A0" letter-spacing="1.80" class="fade d150">SHOPIFY + LIQUID</text><text x="392.0" y="35.0" font-family="Mono" font-size="10.0" fill="#38BDF8" letter-spacing="1.80" class="fade d150" text-anchor="end">LIVE</text><text x="24" y="90" font-family="Display" font-size="26" fill="url(#sheen)" class="rise d270">shop.sanmarfoods.com</text><line x1="24" y1="110" x2="392" y2="110" stroke="#232A4D" class="fade d450"/><text x="24.0" y="136.0" font-family="Mono" font-size="12.0" fill="#949DC2" letter-spacing="0.00" class="fade d450">Food and snacks retailer in</text><text x="24.0" y="154.0" font-family="Mono" font-size="12.0" fill="#949DC2" letter-spacing="0.00" class="fade d520">Singapore. Theme sections and</text><text x="24.0" y="172.0" font-family="Mono" font-size="12.0" fill="#949DC2" letter-spacing="0.00" class="fade d590">product pages customised in Liquid.</text><text x="392" y="192" font-family="Mono" font-size="12" fill="#A5B4FC" text-anchor="end" class="fade d660">&#8599;</text></g><rect width="416" height="210" rx="14" fill="none" stroke="#232A4D"/></svg>