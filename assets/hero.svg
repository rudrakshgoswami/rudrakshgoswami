<svg xmlns="http://www.w3.org/2000/svg" width="860" height="210" viewBox="0 0 860 210" role="img" aria-label="Rudraksh Goswami, web developer at Vocsy Infotech in Surat"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070912"/><stop offset="1" stop-color="#0E1222"/></linearGradient><radialGradient id="halo" cx="0.22" cy="0.12" r="0.85"><stop offset="0" stop-color="#818CF8" stop-opacity="0.26"/><stop offset="0.55" stop-color="#6366F1" stop-opacity="0.06"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient><linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0.6"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#F2F4FF"/><stop offset="1" stop-color="#DCE2FF"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.42"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><clipPath id="card"><rect width="860" height="210" rx="14"/></clipPath></defs><style>@font-face{font-family:'Display';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Mono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@keyframes rise{from{transform:translateY(26px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes sweep{0%{transform:translateX(-120%)}55%,100%{transform:translateX(220%)}}@keyframes breathe{0%,100%{opacity:.30}50%{opacity:.85}}.rise{animation:rise .85s cubic-bezier(.17,.84,.26,1) both}.fade{animation:fade .7s ease-out both}.sweep{animation:sweep 4.6s ease-in-out 1.4s infinite}.breathe{animation:breathe 3.6s ease-in-out infinite}.d150{animation-delay:0.150s}.d270{animation-delay:0.270s}.d450{animation-delay:0.450s}.d580{animation-delay:0.580s}.d650{animation-delay:0.650s}.d710{animation-delay:0.710s}.d770{animation-delay:0.770s}.d830{animation-delay:0.830s}@media (prefers-reduced-motion:reduce){.rise,.fade,.sweep,.breathe{animation:none!important;opacity:1!important;transform:none!important}}</style><rect width="860" height="210" rx="14" fill="url(#bg)"/><rect width="860" height="210" rx="14" fill="url(#halo)"/><g clip-path="url(#card)"><rect x="56" y="46" width="8" height="8" rx="2" fill="#A5B4FC" class="fade breathe"/><text x="74.0" y="54.0" font-family="Mono" font-size="10.5" fill="#6A72A0" letter-spacing="1.90" class="fade d150">WORDPRESS DEVELOPER → AI ENGINEER</text><clipPath id="nm"><text x="56" y="124" font-family="Display" font-size="58">Rudraksh Goswami</text></clipPath><text x="56" y="124" font-family="Display" font-size="58" fill="url(#sheen)" class="rise d270">Rudraksh Goswami</text><g clip-path="url(#nm)"><rect x="0" y="66" width="150" height="90" fill="url(#shine)" class="sweep"/></g><text x="58.0" y="160.0" font-family="Mono" font-size="13.0" fill="#949DC2" letter-spacing="0.00" class="fade d450">I get handed a domain and give back a site that is live.</text><a href="https://rudrakshgoswami.vercel.app"><text x="58" y="186" font-family="Mono" font-size="13" fill="#A5B4FC" class="fade d580">rudrakshgoswami.vercel.app &#8599;</text></a><rect x="700" y="58" width="22" height="22" rx="5" fill="#3B4270" class="fade d650"/><rect x="728" y="58" width="22" height="22" rx="5" fill="#3B4270" class="fade d710"/><rect x="756" y="58" width="22" height="22" rx="5" fill="#38BDF8" class="fade d770"/><rect x="784" y="58" width="22" height="22" rx="5" fill="#3B4270" class="fade d830"/><rect x="700" y="86" width="22" height="22" rx="5" fill="#3B4270" class="fade d650"/><rect x="728" y="86" width="22" height="22" rx="5" fill="#A78BFA" class="fade d710"/><rect x="756" y="86" width="22" height="22" rx="5" fill="#3B4270" class="fade d770"/><rect x="784" y="86" width="22" height="22" rx="5" fill="#3B4270" class="fade d830"/><rect x="700" y="114" width="22" height="22" rx="5" fill="#38